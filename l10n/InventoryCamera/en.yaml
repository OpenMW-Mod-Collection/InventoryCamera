page_name: Inventory Camera
page_desc: Switches to a third-person camera facing your character whenever you open the inventory.

cameraSettings_name: Camera Settings
person_name: Enable for...
person_desc: >
  Due to engine scripts overriding camera controls,
  the mod won't work in third person when you're in combat or magic stance.
person_first: First Person
person_third: Third Person
smoothPanning_name: Smooth Camera Panning
smoothPanning_desc: |
  If enabled, the camera will gradually ease into position. Applies for opening inventory from any person, but closing only in third.
  
  !! Requires a mod that unpauses the inventory !!
  
  If disabled, the camera will instantly snap into its position.
smoothPanning_firstIn: First Person, In
smoothPanning_thirdIn: Third Person, In
smoothPanning_thirdOut: Third Person, Out
panDuration_name: Pan Duration (sec)
yawPanDirection_name: Rotation Direction
yawPanDirection_desc: Which way the camera swings around your character while panning to face it. Only matters if "Smooth Camera Panning" is enabled.
yawPanDirection_auto: Auto (shortest)
yawPanDirection_CW: Clockwise
yawPanDirection_CCW: Counter-clockwise
yawPanDirection_random: Random
restoreOnClose_name: Restore Previous Camera on Inventory Close
restoreOnClose_desc: When closing the inventory, return the camera to whatever mode/rotation it had before.

startingPosition_name: Starting Position
startingPosition_desc: |
  Ignored if "Smooth Camera Panning" is disabled.

  Ignored in third person. Your actual camera position will be used instead.
destination_name: Final Position
distance_name: Distance from the Player
pitch_name: Pitch
pitch_desc: Vertical camera angle.
yaw_name: Yaw
yaw_desc: Horizontal camera angle.
roll_name: Roll
roll_desc: Tilts the camera around its forward axis.
horizontalOffset_name: Horizontal Offset
horizontalOffset_desc: Sadly, it doesn't appear in the settings preview.
horizontalOffset_left: Left
horizontalOffset_right: Right
verticalOffset_name: Vertical Offset
verticalOffset_desc: Sadly, it doesn't appear in the settings preview.
verticalOffset_down: Down
verticalOffset_up: Up
