page_name: Inventory Camera
page_desc: |
  Switches to a third-person camera facing your character whenever you open the inventory.

  Intended to be used together together with some sort of unpaused inventory mod.

cameraSettings_name: Camera Settings
person_name: Active In
first: First Person
third: Third Person
smoothPanning_name: Smooth Panning
smoothPanning_desc: Eases the camera into place instead of snapping instantly.
firstIn: First Person, In
thirdIn: Third Person, In
thirdOut: Third Person, Out
panDuration_name: Pan Duration (sec)
yawPanDirection_name: Rotation Direction
yawPanDirection_desc: >
  Swing direction while panning in.
  Panning out is always done in Auto mode.
yawPanDirection_auto: Auto (shortest)
yawPanDirection_CW: Clockwise
yawPanDirection_CCW: Counter-CW
yawPanDirection_random: Random
antiPreviewKey_name: Suppress Camera Change Key
antiPreviewKey_desc: Opening inventory with this key held skips the camera change.
shift: Shift
ctrl: Ctrl
alt: Alt
none: None
skipDuringCombat_name: Disable During Combat
requireInvWindow_name: Require Inventory Window
requireInvWindow_desc: >
  UI mods tend to use Inventory UI Mode  actual windows to clean your screen.
  With this setting enabled the mod will ignore such cases.

startingPosition_name: Starting Position
startingPosition_desc: |
  Ignored if "Smooth Panning" is disabled.

  Ignored in third person. Your actual camera position will be used instead.
destination_name: Final Position
distance_name: Distance from the Player
pitch_name: Pitch
pitch_desc: Vertical camera angle.
yaw_name: Yaw
yaw_desc: Horizontal camera angle.
roll_name: Roll
roll_desc: Tilts the camera around its forward axis.
horizontalOffset_name: Horizontal Offset
horizontalOffset_left: Left
horizontalOffset_right: Right
verticalOffset_name: Vertical Offset
verticalOffset_down: Down
verticalOffset_up: Up

controls_name: Mouse Controls
controls_desc: |
  Work over empty screen space only - anywhere that is not a window.

  Requires Inventory Extender.
enableMouseControls_name: Enable Mouse Controls
enableMouseControls_desc: >
  Zooming is done with the mouse wheel.
  Other features are configured below.
enableMouseControls_rotate: Rotate
enableMouseControls_move: Pan
enableMouseControls_zoom: Zoom
controlRotate_name: Rotate Modifier
controlRotate_desc: Key to hold while dragging the mouse to rotate the camera around your character.
controlMove_name: Pan Modifier
controlMove_desc: Key to hold while dragging the mouse to slide the camera up, down, left and right without changing its angle.
lmb: LMB
lmb_shift: LMB + Shift
lmb_ctrl: LMB + Ctrl
lmb_alt: LMB + Alt
speed_name: Mouse Controls Speed (%)
speed_rotate: Rotate
speed_pan: Pan
speed_zoom: Zoom
distanceCap_name: Zooming Distance Caps
distanceCap_min: Closest
distanceCap_max: Furthest
dropToEquip_name: Drop Items On Character To Use
dropToEquip_desc: >
  Carry an item out of the inventory and click on your character to equip it (or drink it, read it...),
  the way dropping it on the vanilla paper doll does.
dropTooltip_name: Enable Drop Tooltip
dropTooltip_desc: Shows a little [Use] tooltip when the item will be used instead of dropped on the ground

spotlight_name: Spotlight
spotlight_desc: |
  Hangs a light in front of you, above your head, and fades everything outside a pool of light around you to near black while the inventory is open.

  Requires Post Processing enabled.
spotEnabled_name: Enable Spotlight Shader
spotEnabled_desc: Requires Post Processing enabled
opacity_name: Spotlight Opacity
opacity_desc: Turns the world around you dark.
radiusScale_name: Spotlight Radius
radiusScale_desc: Radius of the pool of light around you, as a multiple of your character's own radius.
softness_name: Edge Softness
softness_desc: How gradually the pool of light fades out at its edge.
light_name: Overhead Light
light_desc: Hangs a real light above your head, so your character is lit even in the dark.
lightInFront_name: Light Distance In Front
lightInFront_desc: How far in front of you the overhead light hangs.
lightAboveHead_name: Light Height Above Head
lightAboveHead_desc: How far above the top of your head the light hangs.
lightRadius_name: Light Radius
lightRadius_desc: How far the overhead light reaches.
lightColor_name: Light Color

depthOfField_name: Depth of Field
depthOfField_desc: |
  Blurs the scene behind you.

  Requires Post Processing enabled.
dofEnabled_name: Enable
aperture_name: Blur Intensity
fade_name: Fade Speed (sec)
fade_in: In
fade_out: Out